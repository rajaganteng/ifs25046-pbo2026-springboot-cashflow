spring:
  application:
    name: username-pbo2026-springboot-cashflow
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true

server:
  port: ${APP_PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml

vaadin:
  launch-browser: false
